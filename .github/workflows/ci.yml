name: Relishable

on:
  push:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.3', '3.4', '4.0' ]
    runs-on: pub-hk-ubuntu-24.04-medium

    name: Setup env & run tests

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7.0.1

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1.331.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake spec
